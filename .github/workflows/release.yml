name: Build & Release

# Trigger: push a version tag like v1.1.0
# Builds Windows (x64) and macOS (arm64 + x64 universal) in parallel,
# then combines all artifacts into a single GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Windows x64 ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run package

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\XCaster-win32-x64 `
            -DestinationPath XCaster-win32-x64.zip `
            -CompressionLevel Optimal
          Write-Host "Size: $([math]::Round((Get-Item XCaster-win32-x64.zip).Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: XCaster-win32-x64.zip
          retention-days: 1

  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-packager . XCaster --platform=darwin --arch=arm64 --out=dist --overwrite --asar --prune=true "--ignore=^/dist" "--ignore=\\.zip$"

      - name: Zip
        run: |
          cd dist
          zip -r ../XCaster-darwin-arm64.zip XCaster-darwin-arm64
          echo "Size: $(du -sh ../XCaster-darwin-arm64.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-zip
          path: XCaster-darwin-arm64.zip
          retention-days: 1

  # ── macOS x64 (Intel) ──────────────────────────────────────────────────────
  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-packager . XCaster --platform=darwin --arch=x64 --out=dist --overwrite --asar --prune=true "--ignore=^/dist" "--ignore=\\.zip$"

      - name: Zip
        run: |
          cd dist
          zip -r ../XCaster-darwin-x64.zip XCaster-darwin-x64
          echo "Size: $(du -sh ../XCaster-darwin-x64.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64-zip
          path: XCaster-darwin-x64.zip
          retention-days: 1

  # ── Create GitHub Release with all three zips ──────────────────────────────
  release:
    needs: [build-windows, build-mac-arm64, build-mac-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64-zip

      - uses: actions/download-artifact@v4
        with:
          name: mac-x64-zip

      # actions/checkout materialises the tag as a LIGHTWEIGHT ref, so
      # `git tag -l --format='%(contents)'` below falls through to the tagged
      # COMMIT's message instead of the tag annotation - which is why releases
      # up to v1.4.0 shipped with a commit message as their notes. Force-fetch
      # the tag so the real annotated tag object is present before we read it.
      - name: Restore annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Extract release notes from tag annotation
        id: notes
        run: |
          msg=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -z "$msg" ]; then msg="Release $GITHUB_REF_NAME"; fi
          delimiter="EOF_$(uuidgen)"
          echo "notes<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$msg" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      # Tags with a SemVer prerelease suffix (e.g. v1.3.0-beta.1, v1.3.0-rc.1)
      # are published as a GitHub prerelease and are NOT marked "Latest" —
      # only plain "vX.Y.Z" tags become the Latest release. This lets a beta
      # build be pushed/released without moving "Latest" off the current
      # stable version.
      - name: Determine release channel (stable vs beta/prerelease)
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "XCaster ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          files: |
            XCaster-win32-x64.zip
            XCaster-darwin-arm64.zip
            XCaster-darwin-x64.zip
